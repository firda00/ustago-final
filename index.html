    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            background-color: #fff;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            color: #000;
        }
        .wrench-red { background-color: #e31837; }
        .text-red-primary { color: #e31837; }
        .hero-bg {
            background: linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.85)), url('https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .shadow-Elite {
          box-shadow: 0 30px 60px rgba(0,0,0,0.1);
        }
        
        ::selection {
          background: #e31837;
          color: white;
        }

        .glass-nav {
          background: rgba(255, 255, 255, 0.9);
          backdrop-filter: blur(25px);
          -webkit-backdrop-filter: blur(25px);
        }

        /* Mobile specific full screen chat override */
        @media (max-width: 768px) {
          .mobile-full-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            border-radius: 0 !important;
          }
        }
    </style>
